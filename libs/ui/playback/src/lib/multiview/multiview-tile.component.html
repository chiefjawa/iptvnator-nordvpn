<button
    type="button"
    class="multiview-tile__surface"
    [attr.aria-label]="title()"
    [attr.aria-pressed]="focused()"
    [attr.aria-keyshortcuts]="keyNumber() || null"
    [title]="
        keyNumber()
            ? ('MULTIVIEW.TILE_SOUND_HINT' | translate: { key: keyNumber() })
            : title()
    "
    (click)="focusRequested.emit()"
    (dblclick)="enlargeRequested.emit()"
>
    <video
        #video
        class="multiview-tile__video"
        playsinline
        [muted]="silent()"
        (playing)="onPlaying()"
        (waiting)="onWaiting()"
    ></video>
</button>

<div class="multiview-tile__bar">
    @if (logo(); as logoUrl) {
        <img class="multiview-tile__logo" [src]="logoUrl" alt="" />
    }
    <span class="multiview-tile__title">{{ title() }}</span>
    <mat-icon class="multiview-tile__sound" aria-hidden="true">{{
        silent() ? 'volume_off' : 'volume_up'
    }}</mat-icon>
    <button
        type="button"
        class="multiview-tile__action"
        data-test-id="multiview-tile-enlarge"
        [attr.aria-label]="
            (enlarged() ? 'MULTIVIEW.SHRINK_TILE' : 'MULTIVIEW.ENLARGE_TILE')
                | translate
        "
        [attr.aria-keyshortcuts]="enlarged() ? 'Escape' : 'F'"
        [attr.aria-pressed]="enlarged()"
        [title]="
            (enlarged() ? 'MULTIVIEW.SHRINK_TILE' : 'MULTIVIEW.ENLARGE_TILE')
                | translate
        "
        (click)="enlargeRequested.emit()"
    >
        <mat-icon>{{ enlarged() ? 'close_fullscreen' : 'open_in_full' }}</mat-icon>
    </button>
    <button
        type="button"
        class="multiview-tile__action"
        data-test-id="multiview-tile-replace"
        [attr.aria-label]="'MULTIVIEW.REPLACE_CHANNEL' | translate"
        [title]="'MULTIVIEW.REPLACE_CHANNEL' | translate"
        (click)="replaceRequested.emit()"
    >
        <mat-icon>swap_horiz</mat-icon>
    </button>
    <button
        type="button"
        class="multiview-tile__action"
        data-test-id="multiview-tile-remove"
        [attr.aria-label]="'MULTIVIEW.REMOVE_TILE' | translate"
        [title]="'MULTIVIEW.REMOVE_TILE' | translate"
        (click)="removeRequested.emit()"
    >
        <mat-icon>close</mat-icon>
    </button>
</div>

@if (noticeKey(); as key) {
    <div
        class="multiview-tile__notice"
        [class.multiview-tile__notice--problem]="
            notice() === 'error' || notice() === 'unsupported'
        "
        role="status"
        data-test-id="multiview-tile-notice"
    >
        {{ key | translate: noticeParams() }}
    </div>
}
